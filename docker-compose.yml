services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s