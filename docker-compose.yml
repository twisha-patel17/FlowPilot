services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173

    depends_on:
      - redis